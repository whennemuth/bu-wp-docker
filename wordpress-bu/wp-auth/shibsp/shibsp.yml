
version: '3.9'

name: shibsp

x-description: |
  This Docker Compose file defines a Shibboleth Service Provider (SP) service that integrates with a WordPress 
  application. It sets up the SP service to handle authentication and authorization for the WordPress site.
  The SP service is configured to communicate with an Identity Provider (IdP) using SAML.
  NOTE: Intended to be used by merging with another Docker Compose file, and NOT run on its own.
  From the project root, run:

  docker compose \
    -f master.yml \
    -f wordpress-baseline/baseline.yml \
    -f wordpress-bu/wp-build/build.yml \
    -f wordpress-bu/wp-auth/shibsp/shibsp.yml \
    config|build|up

services:

  shibsp:
    image: ${DOCKER_REGISTRY}/bu-shibboleth-sp 
    container_name: sp    
    environment:
      TZ: UTC
      DOMAIN: ${HOST_NAME}
      AWS_PROFILE: ${AWS_PROFILE}
      ENTITY_ID: ${ENTITY_ID}
      IDP_CERT: ${IDP_CERT}
      ENTRY_POINT: ${ENTRY_POINT}
      LOGOUT_URL: ${LOGOUT_URL}
      SAML_CERT: ${SAML_CERT}
      SAML_PK: ${SAML_PK}
      APP_AUTHORIZATION: ${APP_AUTHORIZATION}
      APP_LOGIN_HEADER: ${APP_LOGIN_HEADER}
      APP_LOGOUT_HEADER: ${APP_LOGOUT_HEADER}
      DOCKER_SP_PORT: ${DOCKER_SP_PORT:-5000}
      DOCKER_APP_PORT: 80
      DOCKER_APP_HOST: wordpress
      DOCKER_SP_PROXY_EXTRAS: ${DOCKER_SP_PROXY_EXTRAS:-"true"}
      # DEBUG: 'true'
    ports:
      - '${DOCKER_SP_PORT:-5000}:${DOCKER_SP_PORT:-5000}'
      - '80:80'
    networks:
      wp-bridge:
